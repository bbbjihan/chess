name: chess-prod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: [self-hosted, mac-mini, vibecoding]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy production
        env:
          APP_NAME: chess
          DIST_DIR: ${{ github.workspace }}/dist
        run: bash ${{ github.workspace }}/scripts/vibecoding/deploy-prod.sh
