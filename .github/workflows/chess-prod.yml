name: chess-prod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: [self-hosted, mac-mini, vibecoding]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Corepack cache
        run: |
          mkdir -p "$HOME/.local/share/corepack"
          echo "COREPACK_HOME=$HOME/.local/share/corepack" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy production
        env:
          APP_NAME: chess
          DIST_DIR: ${{ github.workspace }}/dist
        run: bash ${{ github.workspace }}/scripts/vibecoding/deploy-prod.sh
