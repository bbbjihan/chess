name: chess-preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  external-pr-check:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip for fork PR
        run: |
          echo "Fork PR detected. Self-hosted preview deploy is intentionally skipped."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Corepack cache
        run: |
          mkdir -p "$HOME/.local/share/corepack"
          echo "COREPACK_HOME=$HOME/.local/share/corepack" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  deploy-preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mac-mini, vibecoding]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Corepack cache
        run: |
          mkdir -p "$HOME/.local/share/corepack"
          echo "COREPACK_HOME=$HOME/.local/share/corepack" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          APP_NAME: chess
          DIST_DIR: ${{ github.workspace }}/dist
        run: bash ${{ github.workspace }}/scripts/vibecoding/deploy-preview.sh

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const body = `Preview ready: https://pr-${pr}.chess.jihan.kr`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body,
            });

  cleanup-preview:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mac-mini, vibecoding]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          APP_NAME: chess
        run: bash ${{ github.workspace }}/scripts/vibecoding/cleanup-preview.sh
