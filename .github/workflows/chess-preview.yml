name: chess-preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: [self-hosted, mac-mini, vibecoding]
    defaults:
      run:
        working-directory: vibecoding/chess
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: vibecoding/chess/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          APP_NAME: chess
          DIST_DIR: ${{ github.workspace }}/vibecoding/chess/dist
        run: bash ${{ github.workspace }}/scripts/vibecoding/deploy-preview.sh

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const body = `Preview ready: https://pr-${pr}.chess.jihan.kr`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body,
            });

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: [self-hosted, mac-mini, vibecoding]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          APP_NAME: chess
        run: bash ${{ github.workspace }}/scripts/vibecoding/cleanup-preview.sh
